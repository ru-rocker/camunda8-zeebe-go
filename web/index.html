<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zeebe Enterprise Workflow &amp; Tasklist Console</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>

  <!-- Top App Navigation -->
  <header class="app-nav">
    <div class="nav-brand">
      <div class="brand-hex">⬡</div>
      <div class="brand-text">
        <h2>Zeebe Ops &amp; Tasklist Console</h2>
        <p>Camunda 8 Resilient Microservices</p>
      </div>
    </div>

    <div class="nav-controls">
      <div class="cluster-indicators">
        <span class="indicator" id="status-zeebe"><span class="dot"></span> Zeebe :26500</span>
        <span class="indicator" id="status-tasklist"><span class="dot"></span> Tasklist :8082</span>
      </div>
      <div class="nav-links">
        <a href="http://localhost:8081" target="_blank" class="external-link">Operate ↗</a>
        <a href="http://localhost:8082" target="_blank" class="external-link">Tasklist ↗</a>
        <button id="btn-deploy" class="btn-action btn-deploy">Deploy All (BPMN/DMN)</button>
      </div>
    </div>
  </header>

  <!-- Main Grid Layout -->
  <main class="console-layout">

    <!-- LEFT COLUMN: Process Instance Launcher & Variable Builder -->
    <aside class="panel panel-initiator">
      <div class="panel-header">
        <h3>Initiate Process Instance</h3>
        <span class="tag tag-indigo">Start Engine</span>
      </div>

      <!-- Quick Preset Cards -->
      <div class="presets-section">
        <span class="sub-label">Scenario Presets:</span>
        <div class="preset-chips">
          <button type="button" class="chip" onclick="applyPreset('risk-platinum')">💎 Platinum VIP</button>
          <button type="button" class="chip" onclick="applyPreset('risk-high')">⚠️ High-Risk Review</button>
          <button type="button" class="chip" onclick="applyPreset('risk-fraud')">🛑 Critical Fraud</button>
          <button type="button" class="chip" onclick="applyPreset('review')">👤 Order Review</button>
        </div>
      </div>

      <form id="form-start-instance">
        <div class="input-block">
          <label for="input-process-id">Process Definition</label>
          <select id="input-process-id" class="input-select" required>
            <option value="order-risk-fulfillment-process">order-risk-fulfillment-process (DMN &amp; Parallel Fork)</option>
            <option value="order-fulfillment-process">order-fulfillment-process (Standard Flow)</option>
          </select>
        </div>

        <div class="grid-2col">
          <div class="input-block">
            <label for="input-customer-id">Customer ID</label>
            <input type="text" id="input-customer-id" class="input-text" value="cust_gold_alice" required />
          </div>
          <div class="input-block">
            <label for="input-tier">Customer Tier</label>
            <select id="input-tier" class="input-select">
              <option value="PLATINUM">PLATINUM (20% DMN)</option>
              <option value="GOLD" selected>GOLD (15% DMN)</option>
              <option value="SILVER">SILVER (10% DMN)</option>
              <option value="STANDARD">STANDARD (0%)</option>
            </select>
          </div>
        </div>

        <div class="grid-2col">
          <div class="input-block">
            <label for="input-amount">Total Amount ($)</label>
            <input type="number" id="input-amount" class="input-text" value="8000.00" step="0.01" required />
          </div>
          <div class="input-block">
            <label for="input-fraud-score">Fraud Risk Score</label>
            <input type="number" id="input-fraud-score" class="input-text" value="55" min="0" max="100" required />
          </div>
        </div>

        <!-- Dynamic Variables Section -->
        <div class="variables-section">
          <div class="variables-header">
            <label>Additional Custom Variables</label>
            <button type="button" class="btn-text" onclick="addVariableRow()">+ Add Variable</button>
          </div>
          <div id="dynamic-variables-container" class="variable-rows">
            <!-- Dynamic Rows injected via JS -->
          </div>
        </div>

        <button type="submit" id="btn-submit-instance" class="btn-action btn-submit">
          Launch Workflow Instance
        </button>
      </form>
    </aside>

    <!-- RIGHT COLUMN: Tasklist Explorer & Work Queue -->
    <section class="panel panel-tasks">
      <div class="panel-header">
        <div class="panel-header-title">
          <h3>Active Human Task Queue</h3>
          <span id="task-counter" class="tag tag-count">0 tasks</span>
        </div>
        <button class="btn-action btn-refresh" onclick="executeTaskQuery()">↻ Refresh Tasks</button>
      </div>

      <!-- TaskQuery Filter Bar -->
      <div class="taskquery-box">
        <form id="form-task-query">
          <div class="query-grid">
            <div class="input-block">
              <label>Task Def ID</label>
              <input type="text" id="query-task-def" class="input-text" placeholder="e.g. Activity_ManagerRiskReview" />
            </div>
            <div class="input-block">
              <label>Assignee</label>
              <input type="text" id="query-assignee" class="input-text" placeholder="e.g. manager_demo" />
            </div>
            <div class="input-block">
              <label>Candidate Group</label>
              <input type="text" id="query-group" class="input-text" placeholder="e.g. risk-managers" />
            </div>
            <div class="input-block">
              <label>Candidate User</label>
              <input type="text" id="query-user" class="input-text" placeholder="e.g. demo" />
            </div>
            <div class="input-block">
              <label>State</label>
              <select id="query-state" class="input-select">
                <option value="CREATED" selected>CREATED (Active)</option>
                <option value="COMPLETED">COMPLETED</option>
                <option value="CANCELED">CANCELED</option>
              </select>
            </div>
          </div>

          <!-- Variable Query Filters -->
          <div class="grid-2col" style="margin-top: 0.75rem;">
            <div class="var-filter-group">
              <label>Task Variable 1 Filter</label>
              <div class="filter-row">
                <input type="text" id="var-filter1-name" class="input-text" placeholder="Key (e.g. customerTier)" />
                <select id="var-filter1-op" class="input-select select-compact">
                  <option value="eq" selected>=</option>
                  <option value="like">~ (like)</option>
                  <option value="neq">!=</option>
                  <option value="gte">&gt;=</option>
                  <option value="lte">&lt;=</option>
                </select>
                <input type="text" id="var-filter1-val" class="input-text" placeholder="Value (e.g. gold)" />
              </div>
            </div>

            <div class="var-filter-group">
              <label>Task Variable 2 Filter</label>
              <div class="filter-row">
                <input type="text" id="var-filter2-name" class="input-text" placeholder="Key (e.g. totalAmount)" />
                <select id="var-filter2-op" class="input-select select-compact">
                  <option value="gte" selected>&gt;=</option>
                  <option value="eq">=</option>
                  <option value="like">~ (like)</option>
                  <option value="lte">&lt;=</option>
                </select>
                <input type="text" id="var-filter2-val" class="input-text" placeholder="Value (e.g. 5000)" />
              </div>
            </div>
          </div>

          <div class="query-actions">
            <button type="button" class="btn-text" onclick="resetTaskQuery()">Clear Query</button>
            <button type="submit" class="btn-action btn-query">Search TaskQuery</button>
          </div>
        </form>
      </div>

      <!-- Task Results Display -->
      <div id="task-feed" class="task-feed">
        <div class="empty-feed">
          <p>No active user tasks loaded. Launch an instance or click "Search TaskQuery".</p>
        </div>
      </div>
    </section>

  </main>

  <div id="toast-rack"></div>

  <script src="/app.js"></script>
</body>
</html>
